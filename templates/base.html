<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPULSE WP4 legal verification tool</title>
    
    <!-- Meta description for search engines and link previews -->
    <meta name="description" content="This is a tool designed as part of the efforts of IMPULSE WP4, based on our earlier conclusions described in deliverables D4.1 and D4.2, as well as the datasets prepared as part of WP3's deliverable D3.2.">
    
    <!-- Open Graph meta tags for Facebook, LinkedIn, WhatsApp, etc. -->
    <meta property="og:title" content="IMPULSE WP4 legal verification tool: main page">
    <meta property="og:description" content="This is a tool designed as part of the efforts of IMPULSE WP4, based on our earlier conclusions described in deliverables D4.1 and D4.2, as well as the datasets prepared as part of WP3's deliverable D3.2.">
    <meta property="og:image" content="{{ url_for('static', filename='img/impulse.jpg', _external=True) }}">
    <meta property="og:url" content="https://www.euimpulselegal.eu/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="IMPULSE WP4 legal verification tool">
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/euimpulse_icon.png') }}" type="image/png">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">IMPULSE WP4 legal verification tool</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Tool</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/info">Info</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/explanations">Explanations</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="text-center my-4">
        <img src="{{ url_for('static', filename='img/impulse.jpg') }}" alt="IMPULSE Logo" style="max-width: 300px; height: auto;">
    </div>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-muted my-4">
        <small>v{{ app_version }}</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/form-toggles.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
